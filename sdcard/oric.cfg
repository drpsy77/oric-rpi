# ORIC.CFG - reglages de l'Oric sur Raspberry Pi
# Place : oric/loci/oric.cfg sur la carte SD (0:ORIC.CFG depuis l'Oric).
# Memes noms que cmdline.txt, qu'ils remplacent (sauf width, height,
# lociflash, qui restent dans cmdline.txt). nom=valeur, # = commentaire.
# Tout est en commentaire : valeur par defaut. Lu au demarrage, recopie
# dans oric/journal.txt. Le mode de l'ecran (50/60 Hz) est dans config.txt.

# --- Affichage ---
# Forme des points : tele = 1,23 fois plus larges que hauts (televiseur
# PAL), carres = comme Oricutron (image plus etroite).
#pixels=tele
# Couleurs de base : tele (televiseur) ou pures (00/FF).
#couleurs=tele
# Saturation en % (100 = inchange, 130 = plus vives, 0 = gris).
#saturation=100
# Luminosite en % (100 = inchange, 120 = plus clair).
#luminosite=100
# Une couleur imposee, RRGGBB en hexadecimal (remplace les deux reglages
# ci-dessus pour cette couleur). Valeurs tele :
#noir=000000
#rouge=FF2A1A
#vert=2EC22E
#jaune=FDDE53
#bleu=0A3CFF
#magenta=EE22EE
#cyan=18E8E8
#blanc=FFFFFF

# --- Clavier ---
# FR = AZERTY (A/Q, Z/W, M, ; ,) ; sinon QWERTY.
#keymap=FR

# --- LOCI ---
# 1 = cartouche LOCI (ROM par defaut : son menu).
#loci=1
# Cle USB 1: de LOCI (dossier de la carte SD).
#lociusb=oric/usb
# Demarrage direct sur une image en A: (sans le menu) ; F8 montre le menu.
#locidisk=0:/cpa-en.dsk

# --- Modem Wi-Fi de LOCI ---
# 1 = modem (firmware/ et wpa_supplicant.conf a la racine de la carte).
# Avec lui, la cle devient 2:.
#modem=1
# 1 = ACIA cadencee a 9600 bauds (defaut 0 : sans cadence, comme LOCI).
#modemcadence=0
# Heure (dates des fichiers ecrits sur la carte SD), avec le modem
# seulement : serveur NTP, et fuseau horaire (regle TZ, heure d'ete
# comprise ; defaut : Paris).
#ntp=pool.ntp.org
#fuseau=CET-1CEST,M3.5.0,M10.5.0/3

# --- Sans LOCI ---
# ROM systeme (defaut basic11b.rom, ou le menu de LOCI avec loci=1).
#rom=oric/basic11b.rom
# Microdisc : les deux lignes ensemble.
#diskrom=oric/microdis.rom
#disk=oric/usb/cpa-en.dsk
# Vitesse du Microdisc : real (vrai lecteur) ou fast.
#fdctiming=real
# Cassette, lue par CLOAD"".
#tape=oric/jeu.tap
