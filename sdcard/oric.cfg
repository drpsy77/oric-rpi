# ORIC.CFG - reglages de l'Oric sur Raspberry Pi
# Place : oric/loci/oric.cfg sur la carte SD (0:ORIC.CFG depuis l'Oric).
# Memes noms que cmdline.txt, qu'ils remplacent (sauf width, height,
# lociflash, reseau, qui restent dans cmdline.txt). nom=valeur, # = commentaire.
# Tout est en commentaire : valeur par defaut. Lu au demarrage, recopie
# dans oric/journal.txt. Le mode de l'ecran (50/60 Hz) est dans config.txt.

# --- Affichage ---
# Forme des points : tele = 1,23 fois plus larges que hauts (televiseur
# PAL), carres = comme Oricutron (image plus etroite).
#pixels=tele
# Couleurs de base : tele (televiseur) ou pures (00/FF).
#couleurs=tele
# Saturation en % (100 = inchange, 130 = plus vives, 0 = gris).
#saturation=100
# Luminosite en % (100 = inchange, 120 = plus clair).
#luminosite=100
# Une couleur imposee, RRGGBB en hexadecimal (remplace les deux reglages
# ci-dessus pour cette couleur). Valeurs tele :
#noir=000000
#rouge=FF2A1A
#vert=2EC22E
#jaune=FDDE53
#bleu=0A3CFF
#magenta=EE22EE
#cyan=18E8E8
#blanc=FFFFFF

# --- Clavier ---
# FR = AZERTY (A/Q, Z/W, M ; Oric : u grave -> ;  * -> '  ; -> .  : -> /
#   carre (2) et ! -> \) ; sinon QWERTY.
# Correspondance d'Oricutron a la place (modele azerty.kma) :
#clavier=oric/azerty.kma
#keymap=FR

# --- LOCI ---
# 1 = cartouche LOCI (ROM par defaut : son menu).
#loci=1
# Cle USB 1: de LOCI (dossier de la carte SD).
#lociusb=oric/usb
# Vraies cles USB branchees sur la Pi (deux au plus, FAT ou exFAT), servies
# par LOCI apres lociusb (apres), ou la premiere a sa place (remplace), ou
# pas (non). Branchement et retrait a chaud, comme sur le vrai LOCI.
# Noms de fichiers sur les cles : sans accent (illisibles depuis l'Oric).
#clesusb=apres
# Demarrage direct sur une image en A: (sans le menu) ; F8 montre le menu.
#locidisk=0:/cpa-en.dsk

# --- Modem Wi-Fi de LOCI ---
# 1 = modem (firmware/ et wpa_supplicant.conf a la racine de la carte,
# sauf avec reseau=ethernet dans cmdline.txt : prise Ethernet de la 3B+).
# Avec lui, la cle devient 2:.
#modem=1
# 1 = ACIA cadencee a 9600 bauds (defaut 0 : sans cadence, comme LOCI).
#modemcadence=0
# Heure (dates des fichiers ecrits sur la carte SD), avec le reseau
# seulement (modem ou tftp) : serveur NTP, et fuseau horaire (regle TZ,
# heure d'ete comprise ; defaut : Paris).
#ntp=pool.ntp.org
#fuseau=CET-1CEST,M3.5.0,M10.5.0/3

# --- Reseau : nom de la Pi, serveur TFTP ---
# Nom de la Pi sur le reseau local (oric.local), avec le modem ou tftp.
# Les noms en .local des autres machines sont trouves aussi (tftp, ATDT).
#nom=oric
# Nom ou adresse du seul ordinateur autorise a lire et ecrire toute la
# carte (noyau, disquettes non montees, journal). Demarre le reseau meme
# sans modem. Sans mot de passe : reseau de confiance seulement.
#tftp=cyberlab.local
# Page web de la carte (navigateur de ce meme ordinateur seulement) :
# liste des dossiers, lecture, envoi de fichiers (4 Mo au plus), etat,
# redemarrage. Port 80 (web=1 aussi) ou autre. Demande tftp=.
#web=80

# --- Sans LOCI ---
# ROM systeme (defaut basic11b.rom, ou le menu de LOCI avec loci=1).
#rom=oric/basic11b.rom
# Microdisc : les deux lignes ensemble.
#diskrom=oric/microdis.rom
#disk=oric/usb/cpa-en.dsk
# Vitesse du Microdisc : real (vrai lecteur) ou fast.
#fdctiming=real
# Cassette, lue par CLOAD"".
#tape=oric/jeu.tap
