#
# wpa_supplicant.conf — Wi-Fi de la Pi, pour le modem de LOCI (modem=1 dans
# cmdline.txt). À la racine de la carte SD, avec le dossier firmware/.
# Remplacer le nom du réseau et le mot de passe (entre guillemets).
#

country=FR

network={
	ssid="nom-du-reseau"
	psk="mot-de-passe"
	proto=WPA2
	key_mgmt=WPA-PSK
	#scan_ssid=1		# pour un réseau caché
}
